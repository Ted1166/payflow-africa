<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .brand-name { font-family: system-ui, sans-serif; font-size: 28px; font-weight: 600; fill: #f0ede6; letter-spacing: -0.5px; }
      .brand-africa { fill: #C9A84C; }
      .brand-sub { font-family: monospace; font-size: 9px; font-weight: 400; fill: #555550; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Mark background -->
  <rect x="0" y="8" width="64" height="64" rx="12" fill="#C9A84C" fill-opacity="0.1"/>

  <!-- Outer hex ring -->
  <polygon points="32,14 46,6 60,14 60,34 46,42 32,34" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.35"/>

  <!-- Vertical bar -->
  <rect x="29" y="10" width="5" height="34" rx="1" fill="#C9A84C" opacity="0.9"/>
  <!-- Horizontal bar -->
  <rect x="15" y="24" width="34" height="5" rx="1" fill="#C9A84C" opacity="0.9"/>

  <!-- Diagonals -->
  <line x1="18" y1="13" x2="46" y2="38" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="46" y1="13" x2="18" y2="38" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Center dot -->
  <circle cx="32" cy="27" r="4" fill="#C9A84C"/>

  <!-- Corner dots -->
  <circle cx="15" cy="27" r="1.5" fill="#C9A84C" opacity="0.5"/>
  <circle cx="49" cy="27" r="1.5" fill="#C9A84C" opacity="0.5"/>
  <circle cx="32" cy="10" r="1.5" fill="#C9A84C" opacity="0.5"/>
  <circle cx="32" cy="44" r="1.5" fill="#C9A84C" opacity="0.5"/>

  <!-- Wordmark -->
  <text class="brand-name" x="80" y="36">PayFlow <tspan class="brand-africa">Africa</tspan></text>
  <text class="brand-sub" x="82" y="54">COMPLIANT PAYROLL ON SOLANA</text>
</svg>