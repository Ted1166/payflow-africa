[package]
name = "payflow_africa"
version = "0.1.0"
description = "Programmable stablecoin payroll and remittance for African markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "payflow_africa"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }

[profile.release]
overflow-checks = true

[workspace]
members = ["."]
